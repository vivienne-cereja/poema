<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>poema</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="source"></div>
      <article id="rendered" class="page" hidden></article>
    </main>

    <dialog id="settings">
      <form method="dialog">
        <label>editor font <input name="editorFont" list="fonts" /></label>
        <label>rendered font <input name="renderedFont" list="fonts" /></label>
        <label>code font <input name="codeFont" list="fonts" /></label>
        <label>line height <input name="lineHeight" type="number" min="1" max="3" step="0.1" /></label>
        <p>esc closes</p>
      </form>
      <datalist id="fonts"></datalist>
    </dialog>

    <script type="module" src="editor.ts"></script>
  </body>
</html>
